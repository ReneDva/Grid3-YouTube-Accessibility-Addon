<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8"/>
<title>YouTube מתחיל</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw; height: 100vh;
    background: #F0F8FF;
    font-family: Arial Black, Arial, sans-serif;
    overflow: hidden;
  }

  .center-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    transform: translateY(-50%);
  }

  /* ── BACKGROUND CIRCLES (decorative) ── */
  .bg-circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.12;
    animation: float 3s ease-in-out infinite alternate;
  }
  .bg-circle.c1 { width:320px; height:320px; background:#29ABE2; top:-80px; left:-80px; animation-delay:0s; }
  .bg-circle.c2 { width:200px; height:200px; background:#FF0000; bottom:-60px; right:-60px; animation-delay:1s; }
  .bg-circle.c3 { width:150px; height:150px; background:#29ABE2; bottom:60px; left:100px; animation-delay:0.5s; }

  @keyframes float {
    from { transform: scale(1) translateY(0); }
    to   { transform: scale(1.08) translateY(-12px); }
  }

  /* ── LOGOS CONTAINER ── */
  .logos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
  }

  /* ── GRID LOGO ── */
  .grid-logo {
    opacity: 0;
    transform: scale(0.3) rotate(-15deg);
    animation: popIn 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards;
  }
  .grid-bubble {
    position: relative;
    width: 180px; height: 150px;
    background: #29ABE2;
    border-radius: 28px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 32px rgba(41,171,226,0.4);
  }
  .grid-bubble::after {
    content: '';
    position: absolute;
    bottom: -28px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-top: 30px solid #29ABE2;
  }
  .grid-g {
    font-size: 100px; font-weight: 900;
    color: white; line-height: 1;
    margin-top: -8px;
  }

  /* ── CONNECTOR ── */
  .connector {
    opacity: 0;
    animation: fadeIn 0.4s ease 1.5s forwards;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .connector-arrow {
    font-size: 48px;
    color: #FFB300;
    animation: bounce 0.6s ease-in-out 1.5s infinite alternate;
  }
  @keyframes bounce {
    from { transform: translateX(-4px); }
    to   { transform: translateX(4px); }
  }

  /* ── YOUTUBE LOGO ── */
  .yt-logo {
    opacity: 0;
    transform: scale(0.3) rotate(15deg);
    animation: popIn 0.7s cubic-bezier(0.34,1.56,0.64,1) 1.1s forwards;
  }
  .yt-button {
    width: 220px; height: 150px;
    background: #FF0000;
    border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 32px rgba(255,0,0,0.35);
  }
  .yt-triangle {
    width: 0; height: 0;
    border-top: 44px solid transparent;
    border-bottom: 44px solid transparent;
    border-left: 76px solid white;
    margin-left: 14px;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.3) rotate(-15deg); }
    to   { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ── TEXT ── */
  .main-text {
    font-size: 56px; font-weight: 900;
    color: #1A237E;
    opacity: 0;
    animation: slideUp 0.6s ease 2s forwards;
    text-align: center;
    letter-spacing: 1px;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── LOADING BAR ── */
  .bar-container {
    margin-top: 36px;
    width: 640px; height: 22px;
    background: #D0E8F5;
    border-radius: 11px;
    overflow: hidden;
    opacity: 0;
    animation: fadeIn 0.4s ease 2.5s forwards;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #29ABE2, #FF0000);
    border-radius: 11px;
    animation: fillBar 7s linear 2.6s forwards;
  }
  @keyframes fillBar {
    from { width: 0%; }
    to   { width: 100%; }
  }

  /* ── DOTS ── */
  .dots {
    margin-top: 20px;
    display: flex; gap: 14px;
    opacity: 0;
    animation: fadeIn 0.4s ease 2.8s forwards;
  }
  .dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #29ABE2;
    animation: pulse 0.9s ease-in-out infinite;
  }
  .dot:nth-child(1) { animation-delay: 0s; }
  .dot:nth-child(2) { animation-delay: 0.3s; background: #FF0000; }
  .dot:nth-child(3) { animation-delay: 0.6s; }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: 0.5; }
    50%      { transform: scale(1.5); opacity: 1; }
  }
</style>
</head>
<body>

<!-- Background -->
<div class="bg-circle c1"></div>
<div class="bg-circle c2"></div>
<div class="bg-circle c3"></div>

<!-- All content centered -->
<div class="center-block">

  <!-- Logos -->
  <div class="logos">
    <div class="grid-logo">
      <div class="grid-bubble">
        <span class="grid-g">G</span>
      </div>
    </div>

    <div class="connector">
      <div class="connector-arrow">▶</div>
    </div>

    <div class="yt-logo">
      <div class="yt-button">
        <div class="yt-triangle"></div>
      </div>
    </div>
  </div>

  <!-- Text -->
  <div class="main-text">YouTube מתחיל...</div>

  <!-- Loading bar -->
  <div class="bar-container">
    <div class="bar-fill"></div>
  </div>

  <!-- Dots -->
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

</div>

<script>
// ── SOUND — Intro Sting (Disney/Netflix style, 10s) ──
window.addEventListener('click', startSound, { once: true });
window.addEventListener('load', () => setTimeout(startSound, 100));

function startSound() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const t = ctx.currentTime;

  // ── Simulated reverb via feedback delay network ──
  function makeReverb(wet = 0.4) {
    const delay1 = ctx.createDelay(0.5); delay1.delayTime.value = 0.13;
    const delay2 = ctx.createDelay(0.5); delay2.delayTime.value = 0.17;
    const fb1 = ctx.createGain(); fb1.gain.value = 0.25;
    const fb2 = ctx.createGain(); fb2.gain.value = 0.22;
    const wetGain = ctx.createGain(); wetGain.gain.value = wet;
    delay1.connect(fb1); fb1.connect(delay1);
    delay2.connect(fb2); fb2.connect(delay2);
    delay1.connect(wetGain); delay2.connect(wetGain);
    wetGain.connect(ctx.destination);
    return { in1: delay1, in2: delay2 };
  }

  const reverb = makeReverb(0.45);
  const master = ctx.createGain();
  master.gain.setValueAtTime(0.0, t);
  master.gain.linearRampToValueAtTime(0.55, t + 0.05);
  master.gain.setValueAtTime(0.55, t + 7.5);
  master.gain.linearRampToValueAtTime(0.0, t + 10.0);
  master.connect(ctx.destination);
  master.connect(reverb.in1);

  // ── Helper: play one note with envelope ──
  function note(freq, start, dur, vol = 0.5, type = 'sine') {
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const attack = 0.015, release = Math.min(0.4, dur * 0.4);
    env.gain.setValueAtTime(0, t + start);
    env.gain.linearRampToValueAtTime(vol, t + start + attack);
    env.gain.setValueAtTime(vol, t + start + dur - release);
    env.gain.exponentialRampToValueAtTime(0.0001, t + start + dur);
    osc.connect(env); env.connect(master);
    osc.start(t + start); osc.stop(t + start + dur + 0.05);
  }

  // ── Helper: sparkle shimmer (high bells) ──
  function sparkle(freq, start) {
    note(freq,      start,        0.6,  0.18, 'sine');
    note(freq * 2,  start + 0.04, 0.4,  0.10, 'sine');
    note(freq * 3,  start + 0.08, 0.25, 0.06, 'sine');
  }

  // ── PHASE 1 (0–2.5s): Rising sparkle build-up ──
  // Ascending shimmer like Disney star sweep
  [1047, 1175, 1319, 1568, 1760, 2093].forEach((f, i) => {
    sparkle(f, i * 0.32);
  });

  // ── PHASE 2 (2.5–5s): Main fanfare HIT ──
  // Big C major chord — root, third, fifth, octave all at once
  const hitT = 2.5;
  const chord = [261.6, 329.6, 392.0, 523.3, 659.3, 784.0];
  chord.forEach(f => note(f, hitT, 3.5, 0.22, 'triangle'));

  // Bass thud underneath (like Netflix "dum")
  note(65.4,  hitT,        2.8, 0.55, 'sine'); // C2
  note(130.8, hitT,        2.5, 0.35, 'sine'); // C3
  note(130.8, hitT + 0.6,  2.0, 0.20, 'sine'); // echo

  // Bright high bell accent on the hit
  note(2093, hitT,        1.2, 0.14, 'sine');
  note(2637, hitT + 0.08, 0.8, 0.10, 'sine');

  // ── PHASE 3 (5–10s): Gentle tail / shimmer decay ──
  [1047, 1319, 1568].forEach((f, i) => {
    sparkle(f, 5.2 + i * 0.5);
    sparkle(f * 1.5, 6.5 + i * 0.4);
  });

  // Soft held chord under the tail
  [523.3, 659.3, 784.0].forEach(f => note(f, 5.0, 4.8, 0.08, 'sine'));
}
</script>
</body>
</html>
