<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<title>YouTube מתחיל</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1280px; height: 720px;
    background: #F0F8FF;
    font-family: Arial Black, Arial, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  .center-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
  }

  /* ── BACKGROUND CIRCLES (decorative) ── */
  .bg-circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.12;
    animation: float 3s ease-in-out infinite alternate;
  }
  .bg-circle.c1 { width:320px; height:320px; background:#29ABE2; top:-80px; left:-80px; animation-delay:0s; }
  .bg-circle.c2 { width:200px; height:200px; background:#FF0000; bottom:-60px; right:-60px; animation-delay:1s; }
  .bg-circle.c3 { width:150px; height:150px; background:#29ABE2; bottom:60px; left:100px; animation-delay:0.5s; }

  @keyframes float {
    from { transform: scale(1) translateY(0); }
    to   { transform: scale(1.08) translateY(-12px); }
  }

  /* ── LOGOS CONTAINER ── */
  .logos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
  }

  /* ── GRID LOGO ── */
  .grid-logo {
    opacity: 0;
    transform: scale(0.3) rotate(-15deg);
    animation: popIn 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards;
  }
  .grid-bubble {
    position: relative;
    width: 180px; height: 150px;
    background: #29ABE2;
    border-radius: 28px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 32px rgba(41,171,226,0.4);
  }
  .grid-bubble::after {
    content: '';
    position: absolute;
    bottom: -28px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-top: 30px solid #29ABE2;
  }
  .grid-g {
    font-size: 100px; font-weight: 900;
    color: white; line-height: 1;
    margin-top: -8px;
  }

  /* ── CONNECTOR ── */
  .connector {
    opacity: 0;
    animation: fadeIn 0.4s ease 1.5s forwards;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .connector-arrow {
    font-size: 48px;
    color: #FFB300;
    animation: bounce 0.6s ease-in-out 1.5s infinite alternate;
  }
  @keyframes bounce {
    from { transform: translateX(-4px); }
    to   { transform: translateX(4px); }
  }

  /* ── YOUTUBE LOGO ── */
  .yt-logo {
    opacity: 0;
    transform: scale(0.3) rotate(15deg);
    animation: popIn 0.7s cubic-bezier(0.34,1.56,0.64,1) 1.1s forwards;
  }
  .yt-button {
    width: 220px; height: 150px;
    background: #FF0000;
    border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 32px rgba(255,0,0,0.35);
  }
  .yt-triangle {
    width: 0; height: 0;
    border-top: 44px solid transparent;
    border-bottom: 44px solid transparent;
    border-left: 76px solid white;
    margin-left: 14px;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.3) rotate(-15deg); }
    to   { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ── TEXT ── */
  .main-text {
    font-size: 56px; font-weight: 900;
    color: #1A237E;
    opacity: 0;
    animation: slideUp 0.6s ease 2s forwards;
    text-align: center;
    letter-spacing: 1px;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── LOADING BAR ── */
  .bar-container {
    margin-top: 36px;
    width: 640px; height: 22px;
    background: #D0E8F5;
    border-radius: 11px;
    overflow: hidden;
    opacity: 0;
    animation: fadeIn 0.4s ease 2.5s forwards;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #29ABE2, #FF0000);
    border-radius: 11px;
    animation: fillBar 7s linear 2.6s forwards;
  }
  @keyframes fillBar {
    from { width: 0%; }
    to   { width: 100%; }
  }

  /* ── DOTS ── */
  .dots {
    margin-top: 20px;
    display: flex; gap: 14px;
    opacity: 0;
    animation: fadeIn 0.4s ease 2.8s forwards;
  }
  .dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #29ABE2;
    animation: pulse 0.9s ease-in-out infinite;
  }
  .dot:nth-child(1) { animation-delay: 0s; }
  .dot:nth-child(2) { animation-delay: 0.3s; background: #FF0000; }
  .dot:nth-child(3) { animation-delay: 0.6s; }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: 0.5; }
    50%      { transform: scale(1.5); opacity: 1; }
  }
</style>
</head>
<body>

<!-- Background -->
<div class="bg-circle c1"></div>
<div class="bg-circle c2"></div>
<div class="bg-circle c3"></div>

<!-- All content centered -->
<div class="center-block">

  <!-- Logos -->
  <div class="logos">
    <div class="grid-logo">
      <div class="grid-bubble">
        <span class="grid-g">G</span>
      </div>
    </div>

    <div class="connector">
      <div class="connector-arrow">▶</div>
    </div>

    <div class="yt-logo">
      <div class="yt-button">
        <div class="yt-triangle"></div>
      </div>
    </div>
  </div>

  <!-- Text -->
  <div class="main-text">YouTube מתחיל...</div>

  <!-- Loading bar -->
  <div class="bar-container">
    <div class="bar-fill"></div>
  </div>

  <!-- Dots -->
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

</div>

<script>
// ── SOUND — Web Audio API ──
// מנגינה עליזה וקצבית, 10 שניות
window.addEventListener('click', startSound, { once: true });
window.addEventListener('load', () => {
  // ניסיון אוטומטי (עובד בחלק מהדפדפנים)
  setTimeout(startSound, 100);
});

function startSound() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.setValueAtTime(0.28, ctx.currentTime);
  master.connect(ctx.destination);

  // מנגינה — נוטות C major עליז
  const notes = {
    C4:261.6, D4:293.7, E4:329.6, F4:349.2,
    G4:392.0, A4:440.0, B4:493.9, C5:523.3,
    E5:659.3, G5:784.0
  };

  // סקוונס מנגינה (תו, זמן_התחלה, משך)
  const melody = [
    ['C4',0.0,0.25], ['E4',0.25,0.25], ['G4',0.5,0.25], ['C5',0.75,0.5],
    ['G4',1.3,0.25], ['E4',1.55,0.25], ['C4',1.8,0.4],
    ['D4',2.3,0.25], ['F4',2.55,0.25], ['A4',2.8,0.25], ['C5',3.05,0.5],
    ['A4',3.6,0.25], ['F4',3.85,0.25], ['D4',4.1,0.4],
    ['E4',4.6,0.25], ['G4',4.85,0.25], ['B4',5.1,0.25], ['E5',5.35,0.5],
    ['G4',5.9,0.25], ['E4',6.15,0.25], ['C4',6.4,0.4],
    ['G4',6.9,0.3],  ['A4',7.2,0.3],  ['G4',7.5,0.3],  ['E4',7.8,0.3],
    ['C4',8.2,0.3],  ['E4',8.5,0.3],  ['G4',8.8,0.25], ['C5',9.1,0.7],
  ];

  melody.forEach(([note, start, dur]) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(notes[note], ctx.currentTime);
    gain.gain.setValueAtTime(0, ctx.currentTime + start);
    gain.gain.linearRampToValueAtTime(0.7, ctx.currentTime + start + 0.02);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + start + dur - 0.02);
    osc.connect(gain);
    gain.connect(master);
    osc.start(ctx.currentTime + start);
    osc.stop(ctx.currentTime + start + dur);
  });

  // Bass פשוט
  const bassNotes = [
    ['C4',0,1],['F4',1,1],['D4',2,1],['G4',3,1],
    ['C4',4,1],['F4',5,1],['G4',6,1],['C4',7,2],
  ];
  bassNotes.forEach(([note, start, dur]) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(notes[note] / 2, ctx.currentTime);
    gain.gain.setValueAtTime(0.18, ctx.currentTime + start);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + start + dur - 0.05);
    osc.connect(gain);
    gain.connect(master);
    osc.start(ctx.currentTime + start);
    osc.stop(ctx.currentTime + start + dur);
  });
}
</script>
</body>
</html>
